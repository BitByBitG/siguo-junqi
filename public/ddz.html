<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>斗地主</title><link rel="icon" href="/ddz-icon.svg"><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/cf-layout.css"><link rel="stylesheet" href="/holdem.css"><link rel="stylesheet" href="/ddz.css"><link rel="stylesheet" href="/vendor/katex/katex.min.css"><link rel="stylesheet" href="/poker-room.css"></head><body><script type="module" src="/site-shell.js"></script><main class="holdem-shell ddz-shell"><header class="holdem-heading"><h1>斗地主</h1></header><p class="holdem-notice">仅限免费娱乐，积分无现实价值。</p><p id="ddz-status" role="status" hidden></p>
<section id="ddz-lobby" hidden><div class="holdem-columns"><section class="panel"><div class="panel-heading"><h2>所有房间</h2><button class="secondary-button" id="ddz-refresh">刷新</button></div><div class="ranking-table-wrap"><table class="ranking-table"><thead><tr><th>房间名称</th><th>房主</th><th>人数</th><th>状态</th><th>操作</th></tr></thead><tbody id="ddz-rooms"></tbody></table></div></section><aside class="panel"><h2>创建房间</h2><form id="ddz-create" class="admin-form"><label>房间名称<input name="name" maxlength="40"></label><label>人数<select name="max"><option value="3">3</option><option value="4">4</option></select></label><button class="secondary-button">创建房间</button></form></aside></div></section>
<section id="ddz-ratings" class="panel" hidden><h2>积分排名</h2><div class="ranking-table-wrap"><table class="ranking-table"><thead><tr><th>排名</th><th>账号</th><th>积分</th></tr></thead><tbody id="ddz-ratings-body"></tbody></table></div></section>
<section id="ddz-room" hidden><div class="topbar poker-toolbar"><strong id="ddz-name" data-no-i18n></strong><code id="ddz-code"></code><button class="secondary-button" id="ddz-invite">复制邀请</button><button class="secondary-button" id="ddz-leave">离开房间</button><button class="secondary-button" id="ddz-close" hidden>关闭房间</button></div><div class="game-layout poker-game-layout"><aside class="players-panel panel"><div class="panel-heading"><h2>玩家</h2></div><div id="ddz-players" class="players-list"></div><div id="ddz-spectators" class="spectators-list"></div><section id="ddz-chat"></section></aside><section class="holdem-board-panel"><div class="ddz-table"><div id="ddz-bottom" class="ddz-cards ddz-bottom"></div><div id="ddz-seats" class="ddz-opponents"></div><div class="ddz-center"><p id="ddz-phase"></p><p id="ddz-result"></p></div><div id="ddz-self"></div><div id="ddz-actions" class="holdem-actions"></div><div id="ddz-hand" class="ddz-hand" data-no-i18n></div></div><section class="ddz-counter"><div class="panel-heading"><h2>记牌器</h2><button id="ddz-counter-toggle" class="icon-button" type="button">收起</button></div><div id="ddz-counter" data-no-i18n></div></section><div id="ddz-reveal"></div></section><aside class="log-panel panel"><div class="panel-heading"><h2>行动记录</h2></div><section id="ddz-settlement" class="poker-settlement" hidden></section><div id="ddz-log" class="battle-log"></div></aside></div></section>
<article id="ddz-rules" class="panel holdem-rulebook" hidden data-no-i18n></article></main><script src="/vendor/marked/marked.umd.js"></script><script src="/vendor/dompurify/purify.min.js"></script><script src="/vendor/katex/katex.min.js"></script><script src="/vendor/katex/contrib/auto-render.min.js"></script><script type="module" src="/ddz.js"></script><script type="module" src="/user-colors.js"></script></body></html>
