<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>设置 · 四国军棋</title><link rel="stylesheet" href="/styles.css"><link rel="icon" type="image/png" href="/favicon.png?v=240"><link rel="apple-touch-icon" href="/favicon.png?v=240"><link rel="stylesheet" href="/cf-layout.css"></head><body class="admin-page"><script type="module" src="/site-shell.js"></script><main class="admin-shell"><h1>设置</h1><section><h2>提醒与显示</h2><div id="preference-options"></div><p id="preference-result" role="status"></p></section><section><h2>头像</h2><form id="avatar-form" class="avatar-form"><input type="file" accept="image/png,image/jpeg,image/gif,image/webp" required aria-label="选择头像"><button type="submit">保存头像</button></form><button id="reset-avatar" type="button">恢复默认头像</button><p>最大 4 MiB，显示时居中裁成正方形。更换或恢复默认时删除旧头像。</p><p id="avatar-result" role="status"></p></section><section><h2>修改密码</h2><p>修改后需在各设备重新登录。</p><form id="credential-form" class="admin-form"><label><span>原密码</span><input name="oldPassword" class="text-input" type="password" autocomplete="current-password" required minlength="6" maxlength="64"></label><label><span>新密码</span><input name="password" class="text-input" type="password" autocomplete="new-password" required minlength="6" maxlength="64"></label><label><span>确认新密码</span><input name="confirm" class="text-input" type="password" autocomplete="new-password" required minlength="6" maxlength="64"></label><button type="submit" class="primary-button">修改密码</button></form><p id="result" role="status"></p></section></main><script type="module" src="/credentials.js"></script><script type="module" src="/user-colors.js"></script><script type="module" src="/settings.js"></script></body></html>
