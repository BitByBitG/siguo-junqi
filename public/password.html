<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>修改密码 · 四国军棋</title><link rel="stylesheet" href="/styles.css"></head><body class="admin-page"><main class="admin-shell"><a href="/">← 返回游戏</a><button data-stealth class="icon-button" type="button">隐蔽模式</button><h1>修改密码</h1><p>修改后需在各设备重新登录。</p><form id="credential-form" class="admin-form"><label><span>原密码</span><input name="oldPassword" class="text-input" type="password" autocomplete="current-password" required minlength="6" maxlength="64"></label><label><span>新密码</span><input name="password" class="text-input" type="password" autocomplete="new-password" required minlength="6" maxlength="64"></label><label><span>确认新密码</span><input name="confirm" class="text-input" type="password" autocomplete="new-password" required minlength="6" maxlength="64"></label><button type="submit" class="primary-button">修改密码</button></form><p id="result" role="status"></p></main><script src="/theme.js"></script><script src="/credentials.js"></script></body></html>
