<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <meta name="theme-color" content="#101813" />
    <meta name="description" content="支持 2～4 名玩家在线游玩的四国军棋" />
    <title>四国军棋</title>
    <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" type="image/png" href="/favicon.png?v=240"><link rel="apple-touch-icon" href="/favicon.png?v=240"><link rel="stylesheet" href="/cf-layout.css"></head>
  <body><script type="module" src="/site-shell.js"></script>
    <div id="app">
      <main id="entry-screen" class="entry-shell">
        <section id="home-main" class="home-main">          <section class="chat-panel" id="announcement-panel">
            <div class="panel-heading"><h2>公告栏</h2><span>仅管理员可发布</span></div>
            <div id="announcement-list" class="chat-list"></div>
            <form id="announcement-form" class="chat-form" hidden><textarea id="announcement-input" maxlength="8000" rows="3" placeholder="发布公告，支持 Markdown、LaTeX 和图片"></textarea><button type="submit">发布公告</button></form>
          </section>
          <section class="chat-panel" id="lobby-chat-panel">
            <div class="panel-heading"><h2>大厅聊天</h2><button id="lobby-chat-expand" class="icon-button" type="button">放大聊天</button><button id="lobby-mentions" class="icon-button" type="button">@ 提醒：关</button></div>
            <div id="lobby-chat-list" class="chat-list"></div>
            <form id="lobby-chat-form" class="chat-form"><textarea id="lobby-chat-input" maxlength="8000" rows="3" placeholder="登录后发言，支持 Markdown、$公式$、![](图片链接)，Ctrl+Enter 发送"></textarea><button type="submit">发送</button></form>
          </section></section>
        <section id="contest-main"><h1>比赛</h1><p id="contest-login"><a href="/login.html?next=/contests.html">登录后创建比赛</a></p><div id="entry-actions" class="entry-actions hidden">            <form id="create-form" class="action-block"><label class="field-label" for="new-room-name">房间名称（可选）</label><input id="new-room-name" class="text-input" maxlength="40" placeholder="留空使用随机房间码">
              <div class="section-heading">
                <div><span class="step-number">01</span><h2>创建新房间</h2></div>
              </div>
              <div class="form-row">
                <label><span>人数</span>
                  <select id="room-capacity">
                    <option value="2">2 人</option>
                    <option value="3">3 人</option>
                    <option value="4" selected>4 人</option>
                  </select>
                </label>
                <label><span>模式</span>
                  <select id="room-mode">
                    <option value="alliance" selected>对家结盟</option>
                    <option value="ffa">四方混战</option>
                  </select>
                </label>
              </div>
              <button class="primary-button" type="submit">创建房间</button>
            </form>

            <div class="divider"><span>或</span></div>

            <form id="join-form" class="action-block">
              <div class="section-heading">
                <div><span class="step-number">02</span><h2>加入房间</h2></div>
              </div>
              <label class="field-label" for="room-code">六位房间码</label>
              <input id="room-code" class="text-input code-input" maxlength="6" autocomplete="off" placeholder="例如 JQ8K2M" />
              <button class="secondary-button" type="submit">进入房间</button>
            </form>
</div></section>
        <aside id="home-sidebar" class="home-sidebar">
          <div class="connection-line"><span id="connection-dot" class="status-dot"></span><span id="connection-text">正在连接</span></div>
          <section class="side-box"><h2>我的账号</h2><div id="home-profile"></div></section>
          <section class="side-box"><h2>Top rated</h2><table class="compact-table"><thead><tr><th>#</th><th>用户</th><th>Rating</th></tr></thead><tbody id="top-rating"></tbody></table><a class="side-more" href="/ratings.html">完整排名 →</a></section>            <section class="room-browser">
              <div class="section-heading"><div><span class="step-number">房间</span><h2>所有房间</h2></div></div>
              <div id="room-list" class="room-list"><div class="empty-log">暂无房间</div></div>
            </section></aside>
        <div hidden>          <form id="login-form" class="action-block login-form">
            <div class="section-heading"><div><span class="step-number">账号</span><h2 id="login-title">登录</h2></div></div>
            <input id="player-name" class="text-input" maxlength="16" autocomplete="username" placeholder="账号" />
            <input id="player-password" class="text-input" type="password" maxlength="64" autocomplete="current-password" placeholder="密码" />
            <button class="primary-button" type="submit">登录</button>
          </form></div>
      </main>

      <main id="game-screen" class="game-shell hidden">
        <header class="topbar">
          <span id="phase-label">布阵中</span>
          <button id="room-code-button" class="room-code-button" title="复制邀请链接"><span>房间</span><strong id="room-code-label">------</strong><i>复制邀请</i></button>
          <div class="topbar-actions">
            <button id="turn-notifications" class="icon-button" type="button" aria-pressed="false">走棋通知：关</button>
            <button id="stealth-button" class="icon-button" type="button" aria-pressed="false">隐蔽模式</button>
            <button id="leave-button" class="icon-button danger-text" type="button">离开</button>
          </div>
        </header>

        <div class="game-layout">
          <aside class="players-panel panel">
            <div class="panel-heading"><h2>参战阵营</h2><span id="mode-label"></span></div>
            <section id="bot-seat-panel" class="bot-seat-panel hidden"></section>
            <div id="players-list" class="players-list"></div>
            <div id="spectators-list" class="spectators-list"></div>
            <div id="host-controls" class="host-controls"></div>
            <section class="chat-panel">
              <div class="panel-heading"><h2>房间聊天</h2><button id="chat-expand" type="button" class="icon-button" aria-pressed="false">放大聊天</button><button id="mention-notifications" class="icon-button" type="button" aria-pressed="false">@ 提醒：关</button></div>
              <div id="chat-list" class="chat-list"></div>
              <form id="chat-form" class="chat-form"><textarea id="chat-input" maxlength="8000" rows="3" placeholder="支持 Markdown、$公式$、![](图片链接)，Ctrl+Enter 发送"></textarea><button type="submit">发送</button></form>
            </section>
          </aside>

          <section class="board-stage">
            <div id="turn-banner" class="turn-banner"></div>
            <div class="board-frame">
              <svg id="game-board" viewBox="-0.8 -0.8 17.6 17.6" role="application" aria-label="四国军棋棋盘"></svg>
              <div class="board-emblem" aria-hidden="true">軍</div>
            </div>
            <div id="board-controls" class="board-controls"></div>
          </section>

          <aside class="log-panel panel">
            <div class="panel-heading"><h2>战况记录</h2><span>最新在前</span></div>
            <div id="battle-log" class="battle-log"></div>
          </aside>
        </div>
      </main>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <div id="piece-mark-menu" class="piece-mark-menu hidden" role="menu" aria-label="标记敌方棋子"></div>

    <link rel="stylesheet" href="/vendor/katex/katex.min.css" />
    <script src="/vendor/marked/marked.umd.js"></script>
    <script src="/vendor/dompurify/purify.min.js"></script>
    <script src="/vendor/katex/katex.min.js"></script>
    <script src="/vendor/katex/contrib/auto-render.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="/app.js"></script>
  <script type="module" src="/user-colors.js"></script></body>
</html>
