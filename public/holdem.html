<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>德州扑克</title><link rel="icon" href="/holdem-icon.svg"><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/cf-layout.css"><link rel="stylesheet" href="/holdem.css"><link rel="stylesheet" href="/vendor/katex/katex.min.css"><link rel="stylesheet" href="/poker-room.css"></head><body>
<script type="module" src="/site-shell.js"></script>
<main class="holdem-shell"><header class="holdem-heading"><h1>德州扑克</h1></header><p class="holdem-notice">仅限免费虚拟筹码，不支持充值、提现、转让或现实奖励。</p><p id="holdem-wallet" class="holdem-wallet" aria-live="polite"></p><p id="holdem-status" role="status" hidden></p>
<section id="holdem-standings" hidden><h2>筹码排名</h2><div class="ranking-table-wrap"><table class="ranking-table"><thead><tr><th>排名</th><th>账号</th><th>可用筹码</th><th>牌桌筹码</th><th>已下注筹码</th><th>总筹码</th></tr></thead><tbody id="holdem-standings-body"></tbody></table></div></section>
<section id="holdem-lobby" hidden><div class="holdem-columns"><section class="panel"><div class="panel-heading"><h2>所有房间</h2><button class="secondary-button" id="holdem-refresh" type="button">刷新</button></div><div class="ranking-table-wrap"><table class="ranking-table"><thead><tr><th>房间名称</th><th>房主</th><th>人数</th><th>状态</th><th>操作</th></tr></thead><tbody id="holdem-rooms"></tbody></table></div></section><aside class="panel"><h2>创建房间</h2><form id="holdem-create" class="admin-form"><label>房间名称<input name="name" maxlength="40"></label><label>人数<select name="max"><option>2</option><option>3</option><option>4</option><option>5</option><option selected>6</option><option>7</option><option>8</option><option>9</option></select></label><label>默认带入筹码<input type="number" name="stack" value="2000" min="200" max="100000" required></label><label>小盲<input type="number" name="sb" value="10" min="1" max="1000" required></label><label>每步秒数<input type="number" name="time" value="30" min="10" max="120" required></label><button class="secondary-button" type="submit">创建房间</button></form></aside></div></section>
<section id="holdem-room" hidden><div class="topbar poker-toolbar"><strong id="holdem-room-name" data-no-i18n></strong><code id="holdem-code"></code><button class="secondary-button" id="holdem-invite" type="button">复制邀请</button><button class="secondary-button" id="holdem-leave" type="button">离开房间</button><button class="secondary-button" id="holdem-close" type="button" hidden>关闭房间</button></div><div class="game-layout poker-game-layout"><aside class="players-panel panel"><div class="panel-heading"><h2>玩家</h2></div><div id="holdem-players" class="players-list"></div><div id="holdem-spectators" class="spectators-list"></div><section id="holdem-chat"></section></aside><section class="holdem-board-panel"><div id="holdem-table" class="holdem-table"></div><div id="holdem-actions" class="holdem-actions"></div><p id="holdem-countdown"></p></section><aside class="log-panel panel"><div class="panel-heading"><h2>行动记录</h2></div><section id="holdem-settlement" class="poker-settlement" hidden></section><div id="holdem-log" class="battle-log"></div></aside></div></section>
</main>
<script src="/vendor/marked/marked.umd.js"></script><script src="/vendor/dompurify/purify.min.js"></script><script src="/vendor/katex/katex.min.js"></script><script src="/vendor/katex/contrib/auto-render.min.js"></script><script type="module" src="/holdem.js"></script><script type="module" src="/user-colors.js"></script></body></html>
